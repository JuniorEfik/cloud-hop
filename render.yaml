services:
  - type: web
    name: near-arcade
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:production
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEAR_NETWORK_ID
        value: testnet
      - key: NEAR_RPC_URL
        value: https://test.rpc.fastnear.com
      - key: NEAR_EXPLORER_URL
        value: https://testnet.nearblocks.io
      - key: NEAR_CONTRACT_ID
        value: near-arcade-contract-bf1dd35d6d.testnet
      - key: NEAR_FAST_AUTH_CLIENT_ID
        value: np8paqIpMWmNbzT4xAvOOapZBjsOpptl
      - key: NEAR_FAST_AUTH_CONTRACT_ID
        value: fast-auth.testnet
      - key: NEAR_MPC_CONTRACT_ID
        value: v1.signer-prod.testnet
      - key: NEAR_SPONSOR_ACCOUNT_ID
        sync: false
      - key: NEAR_SPONSOR_PRIVATE_KEY
        sync: false
      - key: NEAR_RELAYER_ACCOUNT_ID
        sync: false
      - key: NEAR_RELAYER_PRIVATE_KEY
        sync: false
      - key: NEAR_VERIFIER_PRIVATE_KEY
        sync: false
